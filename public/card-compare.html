<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Card Style — Overlay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #09090b; color: #fafafa; font-family: system-ui, sans-serif; }

    .card-trace {
      position: relative;
      border: none !important;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card-trace::before {
      content: '';
      position: absolute;
      inset: -1.5px;
      border-radius: inherit;
      background: conic-gradient(from var(--angle, 0deg), transparent 0%, transparent 60%, #22d3ee 80%, transparent 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 0;
      pointer-events: none;
    }

    .card-trace > * {
      position: relative;
      z-index: 1;
    }

    .card-trace:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(34, 211, 238, 0.1);
    }

    .card-trace:hover::before {
      opacity: 1;
    }
  </style>
</head>
<body class="p-12 flex flex-col gap-16">

  <div class="card-trace relative rounded-2xl w-72 cursor-pointer group" style="aspect-ratio:3/4;">
    <div class="absolute inset-0 rounded-2xl overflow-hidden" style="z-index:1;">
      <img src="/tavernboard-icon.svg" class="absolute inset-0 w-full h-full object-cover" />
      <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent"></div>
      <div class="absolute bottom-0 left-0 right-0 p-4 flex flex-col gap-2">
        <h3 class="font-semibold text-white group-hover:text-cyan-400 transition-colors">Tavernboard</h3>
        <p class="text-sm text-zinc-300 leading-snug line-clamp-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300">Personal Android & Web productivity app combining calendar, to-do lists, and project management.</p>
        <div class="flex gap-1 flex-wrap">
          <span class="px-2 py-0.5 rounded-md bg-white/10 text-zinc-300 text-xs font-mono">Flutter</span>
          <span class="px-2 py-0.5 rounded-md bg-white/10 text-zinc-300 text-xs font-mono">Dart</span>
          <span class="px-2 py-0.5 rounded-md bg-white/10 text-zinc-300 text-xs font-mono">SQLite</span>
          <span class="px-2 py-0.5 rounded-md bg-white/10 text-zinc-300 text-xs font-mono">+1</span>
        </div>
      </div>
    </div>
  </div>

<script>
  const cards = document.querySelectorAll('.card-trace');
  const angles = new Map();

  function animate() {
    cards.forEach((card) => {
      if (card.matches(':hover')) {
        const current = angles.get(card) ?? 0;
        const next = (current + 1.5) % 360;
        angles.set(card, next);
        card.style.setProperty('--angle', `${next}deg`);
      }
    });
    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
